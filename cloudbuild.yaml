substitutions:
  # Ganti nilai ini sesuai project GCP Anda
  _REGION: asia-southeast2 # Jakarta (paling dekat ke Indonesia)
  _REPOSITORY: kokimugi # Nama Artifact Registry repository
  _SERVICE_NAME: kokimugi-app # Nama Cloud Run service
  _IMAGE_NAME: kokimugi # Nama image Docker

# Image yang akan di-cache untuk mempercepat build berikutnya
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8 # CPU lebih banyak = build lebih cepat

steps:
  # ─────────────────────────────────────────────
  # Step 1: Build Docker image
  # ─────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      - build
      - "--tag"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA"
      - "--tag"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest"
      - "--cache-from"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest"
      - "--build-arg"
      - "BUILDKIT_INLINE_CACHE=1"
      - "."
    env:
      - "DOCKER_BUILDKIT=1"

  # ─────────────────────────────────────────────
  # Step 2: Push image ke Artifact Registry
  # ─────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    waitFor: ["build-image"]
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}"

  # ─────────────────────────────────────────────
  # Step 3: Deploy ke Cloud Run
  # ─────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-cloud-run"
    waitFor: ["push-image"]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--concurrency=80"
      - "--timeout=300"
      - "--port=8080"
      - "--allow-unauthenticated"
      - "--set-secrets=GOOGLE_AI_KEY=kokimugi-google-ai-key:latest"
      - "--traffic=LATEST=100"

# Image yang di-push ke registry
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest"

# Timeout total untuk pipeline (20 menit cukup untuk build Next.js)
timeout: "1200s"
